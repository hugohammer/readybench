# Study A configuration (draft, see docs/analysis_plan.md)

gold_standard:
  source: tabrepo
  release: "2023_11_14"
  primary: AutoGluon_bq_4h8c_2023_11_14   # AutoGluon best quality, 4 h, 8 cores
  folds: [0, 1, 2]                        # the folds TabRepo evaluated
